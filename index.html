
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 24px;
    }
    .app {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #0001;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    <button onclick="calculate()">계산하기</button>
<button onclick="location.reload()">초기화</button>
    #result {
      font-size: 28px;
      font-weight: bold;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>Mini Calculator v1.1</h2>
    <input id="a" type="number" placeholder="숫자 A">
    <select id="op">
      <option value="+">더하기 (+)</option>
      <option value="-">빼기 (-)</option>
      <option value="*">곱하기 (×)</option>
      <option value="/">나누기 (÷)</option>
    </select>
    <input id="b" type="number" placeholder="숫자 B">
    <button onclick="calculate()">계산하기</button>
    <div id="result">결과: -</div>
  </div>
  <script>
    function calculate() {
      const a = document.getElementById("a");
      const b = document.getElementById("b");
      const op = document.getElementById("op").value;
      const result = document.getElementById("result");

      if (a.value === "" || b.value === "") {
        result.textContent = "숫자를 입력하세요.";
        return;
      }

      const x = Number(a.value);
      const y = Number(b.value);
      let value;

      if (op === "+") value = x + y;
      if (op === "-") value = x - y;
      if (op === "*") value = x * y;
      if (op === "/") {
        if (y === 0) {
          result.textContent = "0으로 나눌 수 없습니다.";
          return;
        }
        value = x / y;
      }

      result.textContent = "결과: " + value.toLocaleString("ko-KR");
    }
  </script>
</body>
</html>
